name: Test action helpers

on: [push, pull_request]

jobs:
  fixture-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install helper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run helper unit tests and composite-action harness
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/ -q
      - name: Check the skill bundle matches the action contract
        run: python scripts/check_bundle.py
      - name: Check ONBOARD.md URLs resolve
        run: python scripts/check_onboard_urls.py
      - name: Run paired gate against fixture artifacts
        run: |
          python scripts/compare_runs.py \
            --baseline tests/fixtures/baseline \
            --current tests/fixtures/current \
            --out gate_report.json \
            --pr-comment pr_comment.md
          python - <<'PY'
          import json
          report = json.load(open('gate_report.json', encoding='utf-8'))
          assert report['decision'] in {'PASS', 'WARN', 'FAIL', 'Inconclusive'}
          assert report['n_paired_cases'] == 30
          print(report['decision'])
          PY
      - name: Smoke-test write_firstrun_report.py
        run: |
          python scripts/write_firstrun_report.py \
            --current-run-root tests/fixtures/current \
            --baseline-reason 'fixture smoke test' \
            --out gate_report.firstrun.json \
            --pr-comment pr_comment.firstrun.md
          python - <<'PY'
          import json
          report = json.load(open('gate_report.firstrun.json', encoding='utf-8'))
          assert report['decision'] == 'FirstRun', report['decision']
          assert report['current_n_cases'] == 30, report['current_n_cases']
          assert report['n_paired_cases'] == 0
          assert 'fixture smoke test' in report['warnings']
          assert open('pr_comment.firstrun.md', encoding='utf-8').read().startswith('## 🛡️ ASSERT')
          print('FirstRun report OK')
          PY
      - name: Smoke-test detect_test_set_drift.py (matching SHAs)
        run: |
          python scripts/detect_test_set_drift.py \
            --baseline-root tests/fixtures/baseline \
            --current-run-root tests/fixtures/current \
            --artifacts-root tests/fixtures/current \
            --out gate_report.drift.json \
            --pr-comment pr_comment.drift.md
          # Fixtures share an identical test_set.jsonl, so the script must take
          # the matching-SHAs path: skip-compare=false to GITHUB_OUTPUT, no
          # gate_report.json or pr_comment.md written.
          python - <<'PY'
          import os, pathlib
          out = pathlib.Path(os.environ['GITHUB_OUTPUT']).read_text(encoding='utf-8')
          assert 'skip-compare=false' in out, out
          assert 'baseline-test-set-sha=' in out, out
          assert 'current-test-set-sha=' in out, out
          assert not pathlib.Path('gate_report.drift.json').exists()
          assert not pathlib.Path('pr_comment.drift.md').exists()
          print('TestSetDrift (matching) OK')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixture-gate-report
          path: |
            gate_report.json
            pr_comment.md
            gate_report.firstrun.json
            pr_comment.firstrun.md
          if-no-files-found: warn

  # The harness above extracts the `run:` scripts out of action.yml and executes
  # them directly. That covers the bash logic, but it cannot cover the part a
  # consumer actually depends on: GitHub resolving `uses:`, plumbing `with:`
  # inputs, and expanding `${{ github.action_path }}` -- which only has a value
  # when the action is invoked as an action. A repo calling this action would
  # hit those first, and nothing tested them.
  #
  # So: call the action the way a consumer does, from a scratch repo layout, and
  # assert it gets all the way to the model call. Steps 1-9 (setup, install
  # assert-ai, resolve configs, plan behaviors, resolve baseline, export creds)
  # need no credentials; only step 10 does. The run is expected to fail there,
  # which is why the gate step is continue-on-error -- the assertions afterwards
  # are what decide this job.
  consumer-smoke:
    name: A consumer repo can resolve and run the action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lay out a minimal consumer repo
        run: |
          mkdir -p eval/behaviors
          cat > eval/behaviors/smoke.yaml <<'YAML'
          suite: consumer-smoke
          behavior:
            name: consumer_smoke
            description: >
              Placeholder behavior used only to prove a consumer repo can
              resolve and start the action. Never reaches a live model.
          context: A smoke-test target that is never actually invoked.
          pipeline:
            inference:
              target:
                callable: smoke_target:respond
          YAML
          cat > smoke_target.py <<'PY'
          def respond(message, history=None):
              return "smoke"
          PY
          echo "--- consumer layout ---"
          find eval smoke_target.py -type f

      - name: Call the action exactly as a consumer would
        id: gate
        continue-on-error: true
        uses: ./
        with:
          configs: eval/behaviors/*.yaml
          provider-env: |
            OPENAI_API_KEY=smoke-not-a-real-key
          post-pr-comment: 'false'

      - name: Assert the action resolved and ran its own steps
        run: |
          set -euo pipefail

          # If `uses:` had failed to resolve, or action.yml were invalid, the
          # job would have died before this step ever ran.
          echo "action resolved and executed"

          # Step 2 installed the pinned assert-ai into the runner.
          command -v assert-ai >/dev/null \
            || { echo "::error::action did not install assert-ai"; exit 1; }
          echo "assert-ai on PATH: $(assert-ai --version 2>/dev/null || echo present)"

          # Step 5 ran plan_behaviors.py via ${{ github.action_path }}. Its
          # output existing proves that expression expanded to a real path --
          # the single thing the offline harness cannot verify.
          test -f assert-ai-behaviors.json \
            || { echo "::error::plan_behaviors.py did not run; github.action_path likely unresolved"; exit 1; }

          python - <<'PY'
          import json
          plan = json.load(open("assert-ai-behaviors.json", encoding="utf-8"))
          behaviors = plan["behaviors"] if isinstance(plan, dict) else plan
          assert behaviors, "planner produced no behaviors from the glob"
          roots = [b.get("artifacts_root") for b in behaviors]
          assert len(set(roots)) == len(roots), f"artifact roots collide: {roots}"
          print(f"planned {len(behaviors)} behavior(s) from configs: {[b.get('name') for b in behaviors]}")
          PY

          echo "consumer path OK: resolve -> install -> resolve configs -> plan"
