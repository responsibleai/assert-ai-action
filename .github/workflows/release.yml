name: Release floating major tag

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Move matching major tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          MAJOR=$(echo $TAG | cut -d. -f1)
          git tag -f $MAJOR $TAG
          git push origin $MAJOR --force
