name: 'ASSERT safety regression gate'
description: 'Run assert-ai evals in CI and gate pull requests on paired safety regressions across one or many behaviors.'
author: 'Microsoft Corporation'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  configs:
    description: >-
      Path, glob, or newline-delimited list of assert-ai YAML eval configs
      (for example: eval/behaviors/*.yaml). ASSERT configs are written one
      behavior per file, so each match becomes one gated behavior.
    required: false
    default: ''
  config:
    description: 'DEPRECATED single-config alias for `configs`. Use `configs` instead.'
    required: false
    default: ''
  gate-mode:
    description: >-
      `regression` (default) blocks only on a statistically significant
      regression. `improvement` passes only on a statistically significant
      improvement in `primary-dimension` with no regression in
      `guard-dimensions` -- use it on remediation pull requests.
    required: false
    default: 'regression'
  primary-dimension:
    description: 'Dimension that must improve under `gate-mode: improvement`.'
    required: false
    default: 'policy_violation'
  guard-dimensions:
    description: 'Comma-separated dimensions that must not regress under either gate mode.'
    required: false
    default: 'overrefusal'
  alpha:
    description: 'Family-wise significance level for the Holm-Bonferroni correction.'
    required: false
    default: '0.05'
  min-pairs:
    description: 'Minimum paired test cases required before a dimension can reach a statistical verdict.'
    required: false
    default: '30'
  baseline:
    description: >-
      Path to a baseline run directory, or the NAME of an artifact uploaded by a
      trusted run. When an artifact name is given, the action finds the most
      recent successful run on `baseline-branch` that still has that artifact and
      downloads it -- artifacts are scoped to the run that produced them, so a
      pull request cannot see the default branch's baseline without this lookup.
    required: false
    default: ''
  baseline-branch:
    description: 'Branch whose successful runs hold the trusted baseline artifact. Defaults to the repository default branch.'
    required: false
    default: ''
  assert-ai-version:
    description: 'Version of assert-ai to install from PyPI.'
    required: false
    default: '0.1.0'
  extras:
    description: "Comma-separated assert-ai extras to install from PyPI (for example: 'regression,otel,langgraph')."
    required: false
    default: 'regression'
  target-install:
    description: >-
      Optional shell command run in the workspace after assert-ai is installed
      and before eval execution, for example: pip install -e .
    required: false
    default: ''
  provider-env:
    description: >-
      Newline-delimited KEY=VALUE pairs exported for the eval run. Use this for
      any LiteLLM provider (OPENAI_API_KEY, ANTHROPIC_API_KEY, AWS_*, ...).
      Supply values from secrets; they are masked in the log.
    required: false
    default: ''
  azure-api-key:
    description: 'Azure / LiteLLM API key. Exposed as AZURE_API_KEY at runtime.'
    required: false
    default: ''
  azure-api-base:
    description: 'Azure / LiteLLM endpoint base URL. Exposed as AZURE_API_BASE at runtime.'
    required: false
    default: ''
  azure-api-version:
    description: 'Azure API version (e.g. 2024-12-01-preview). Exposed as AZURE_API_VERSION at runtime.'
    required: false
    default: ''
  post-pr-comment:
    description: 'When true and run from a pull_request event, upsert a markdown gate report as a PR comment.'
    required: false
    default: 'true'
  comment-marker:
    description: 'HTML comment marker used to idempotently upsert the PR comment.'
    required: false
    default: '<!-- assert-ai-gate -->'
  fail-on-regression:
    description: 'When true, the action exits 1 if the gate verdict is FAIL. When false, the gate report is still produced but the job stays green.'
    required: false
    default: 'true'
  allow-inconclusive:
    description: >-
      Labeling only. When false, statistically insignificant dimensions are
      reported as Uncertain and the overall verdict becomes WARN instead of
      Inconclusive. The job still passes in both cases -- see docs/verdicts.md.
    required: false
    default: 'true'

outputs:
  gate-verdict:
    description: 'Gate verdict: PASS, WARN, FAIL, FirstRun, TestSetChanged, or Inconclusive.'
    value: ${{ steps.decide.outputs.gate-verdict }}
  gate-report-path:
    description: 'Path to the JSON gate report.'
    value: ${{ steps.decide.outputs.gate-report-path }}
  n-paired-cases:
    description: 'Number of paired test cases used by the statistical gate.'
    value: ${{ steps.decide.outputs.n-paired-cases }}
  behaviors-evaluated:
    description: 'Number of behavior configs that produced a comparable run.'
    value: ${{ steps.decide.outputs.behaviors-evaluated }}
  pr-comment-url:
    description: 'URL of the posted or updated pull request comment, if any.'
    value: ${{ steps.post-comment.outputs.pr-comment-url }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        # No `cache: pip` here, deliberately. setup-python's pip cache hashes
        # a dependency file from the *calling* repo, and hard-fails with
        # "No file matched to [**/requirements.txt or **/pyproject.toml]" when
        # the consumer has neither at its root -- a Node repo with a Python
        # agent, a repo whose pyproject.toml lives in a subdirectory, or one
        # that vendors its dependencies. Because this is the action's first
        # step, that failure skips every step after it, so the gate silently
        # does nothing instead of evaluating anything. We only install
        # assert-ai from PyPI, so the cache buys a few seconds and costs the
        # action's ability to run in a large class of repositories.

    - name: Install assert-ai
      shell: bash
      env:
        ASSERT_AI_EXTRAS: ${{ inputs.extras }}
        ASSERT_AI_VERSION: ${{ inputs.assert-ai-version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install PyYAML
        if [ -n "$ASSERT_AI_EXTRAS" ]; then
          python -m pip install "assert-ai[${ASSERT_AI_EXTRAS}]==${ASSERT_AI_VERSION}"
        else
          python -m pip install "assert-ai==${ASSERT_AI_VERSION}"
        fi

    - name: Resolve config input
      id: configs
      shell: bash
      env:
        CONFIGS: ${{ inputs.configs }}
        LEGACY_CONFIG: ${{ inputs.config }}
      run: |
        if [ -n "$CONFIGS" ]; then
          selected="$CONFIGS"
        elif [ -n "$LEGACY_CONFIG" ]; then
          echo "::warning::'config' is deprecated; use 'configs', which accepts a glob or a newline-delimited list."
          selected="$LEGACY_CONFIG"
        else
          echo "::error::one of 'configs' or 'config' is required"
          exit 1
        fi
        {
          echo "selected<<__ASSERT_EOF__"
          echo "$selected"
          echo "__ASSERT_EOF__"
        } >> "$GITHUB_OUTPUT"

    - name: Install target
      if: ${{ inputs.target-install != '' }}
      shell: bash
      env:
        TARGET_INSTALL: ${{ inputs.target-install }}
      run: |
        set -euo pipefail
        echo "::group::target-install"
        bash -euo pipefail -c "$TARGET_INSTALL"
        echo "::endgroup::"

    - name: Plan behaviors
      id: plan
      shell: bash
      env:
        SELECTED_CONFIGS: ${{ steps.configs.outputs.selected }}
      run: |
        python "${{ github.action_path }}/scripts/plan_behaviors.py" plan \
          --configs "$SELECTED_CONFIGS" \
          --artifacts-root "$GITHUB_WORKSPACE/assert-ai-artifacts" \
          --out assert-ai-behaviors.json

    - name: Resolve baseline input
      id: resolve-baseline
      shell: bash
      run: |
        baseline="${{ inputs.baseline }}"
        if [ -z "$baseline" ]; then
          echo "baseline-status=missing" >> "$GITHUB_OUTPUT"
          echo "baseline-root=" >> "$GITHUB_OUTPUT"
          echo "artifact-name=" >> "$GITHUB_OUTPUT"
          echo "needs-download=false" >> "$GITHUB_OUTPUT"
        elif [ -e "$baseline" ]; then
          echo "baseline-status=path" >> "$GITHUB_OUTPUT"
          echo "baseline-root=$baseline" >> "$GITHUB_OUTPUT"
          echo "artifact-name=" >> "$GITHUB_OUTPUT"
          echo "needs-download=false" >> "$GITHUB_OUTPUT"
        else
          echo "baseline-status=artifact" >> "$GITHUB_OUTPUT"
          echo "baseline-root=assert-ai-baseline" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$baseline" >> "$GITHUB_OUTPUT"
          echo "needs-download=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Find the baseline run
      id: baseline-run
      if: ${{ steps.resolve-baseline.outputs.needs-download == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python "${{ github.action_path }}/scripts/find_baseline_run.py" \
          --artifact-name "${{ steps.resolve-baseline.outputs.artifact-name }}" \
          --branch "${{ inputs.baseline-branch != '' && inputs.baseline-branch || github.event.repository.default_branch }}"

    - name: Download baseline artifact
      if: ${{ steps.resolve-baseline.outputs.needs-download == 'true' && steps.baseline-run.outputs.found == 'true' }}
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ steps.resolve-baseline.outputs.artifact-name }}
        path: assert-ai-baseline
        run-id: ${{ steps.baseline-run.outputs.run-id }}
        github-token: ${{ github.token }}

    - name: Export provider credentials
      shell: bash
      env:
        PROVIDER_ENV: ${{ inputs.provider-env }}
        AZURE_API_KEY_IN: ${{ inputs.azure-api-key }}
        AZURE_API_BASE_IN: ${{ inputs.azure-api-base }}
        AZURE_API_VERSION_IN: ${{ inputs.azure-api-version }}
      run: |
        # Mask before writing to GITHUB_ENV so a downstream `set -x` or a
        # crashing provider SDK cannot echo a live key into the log.
        emit() {
          key="$1"
          value="$2"
          if [ -z "$value" ]; then return 0; fi
          echo "::add-mask::$value"
          printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
        }
        emit AZURE_API_KEY "$AZURE_API_KEY_IN"
        emit AZURE_API_BASE "$AZURE_API_BASE_IN"
        emit AZURE_API_VERSION "$AZURE_API_VERSION_IN"
        while IFS= read -r line; do
          case "$line" in
            ''|\#*) continue ;;
          esac
          case "$line" in
            *=*) ;;
            *) continue ;;
          esac
          key="${line%%=*}"
          value="${line#*=}"
          key="$(printf '%s' "$key" | tr -d '[:space:]')"
          if [ -n "$key" ]; then emit "$key" "$value"; fi
        done <<< "$PROVIDER_ENV"

    - name: Run assert-ai
      shell: bash
      run: |
        set -euo pipefail
        python -c "import json;[print(e['frozen']) for e in json.load(open('assert-ai-behaviors.json',encoding='utf-8'))]" > .assert-ai-frozen-list
        while IFS= read -r frozen; do
          frozen="${frozen%$'\r'}"
          if [ -z "$frozen" ]; then continue; fi
          echo "::group::assert-ai run --config $frozen"
          assert-ai run --config "$frozen"
          echo "::endgroup::"
        done < .assert-ai-frozen-list

    - name: Locate runs
      id: locate
      shell: bash
      run: |
        python "${{ github.action_path }}/scripts/plan_behaviors.py" resolve \
          --manifest assert-ai-behaviors.json \
          --baseline-root "${{ steps.resolve-baseline.outputs.baseline-root }}" \
          --out assert-ai-comparable.json \
          --all-out assert-ai-resolved.json

    - name: Write FirstRun report
      if: ${{ steps.locate.outputs.baseline-available != 'true' }}
      shell: bash
      run: |
        python "${{ github.action_path }}/scripts/write_firstrun_report.py" \
          --current-run-root "${{ steps.locate.outputs.first-current }}" \
          --baseline-reason "no baseline run was available for any behavior" \
          --out gate_report.json \
          --pr-comment pr_comment.md

    - name: Detect test-set drift
      id: drift
      if: ${{ steps.locate.outputs.baseline-available == 'true' }}
      shell: bash
      run: |
        python "${{ github.action_path }}/scripts/detect_test_set_drift.py" \
          --behaviors assert-ai-comparable.json \
          --artifacts-root "${{ github.workspace }}/assert-ai-artifacts" \
          --out gate_report.json \
          --pr-comment pr_comment.md

    - name: Run the paired gate
      if: ${{ steps.locate.outputs.baseline-available == 'true' && steps.drift.outputs.skip-compare != 'true' }}
      shell: bash
      run: |
        python "${{ github.action_path }}/scripts/compare_runs.py" \
          --behaviors assert-ai-comparable.json \
          --gate-mode "${{ inputs.gate-mode }}" \
          --primary-dimension "${{ inputs.primary-dimension }}" \
          --guard-dimensions "${{ inputs.guard-dimensions }}" \
          --alpha "${{ inputs.alpha }}" \
          --min-pairs "${{ inputs.min-pairs }}" \
          --out gate_report.json \
          --pr-comment pr_comment.md \
          --allow-inconclusive "${{ inputs.allow-inconclusive }}"

    - name: Annotate partial coverage
      if: ${{ steps.locate.outputs.dropped-count != '0' && hashFiles('gate_report.json') != '' }}
      shell: bash
      env:
        DROPPED_COUNT: ${{ steps.locate.outputs.dropped-count }}
        DROPPED_NAMES: ${{ steps.locate.outputs.dropped-names }}
      run: |
        python <<'PY'
        import json
        import os
        from pathlib import Path

        report_path = Path("gate_report.json")
        report = json.loads(report_path.read_text(encoding="utf-8"))
        names = [n for n in os.environ.get("DROPPED_NAMES", "").split(",") if n]
        count = int(os.environ.get("DROPPED_COUNT") or len(names) or 0)
        warning = (
            f"{count} behavior(s) had no matching baseline and were not evaluated: "
            + (", ".join(names) if names else "(names unavailable)")
        )
        report["dropped_behavior_count"] = count
        report["dropped_behaviors"] = names
        report.setdefault("warnings", []).append(warning)
        report_path.write_text(json.dumps(report, indent=2), encoding="utf-8")

        comment = Path("pr_comment.md")
        if comment.is_file():
            with comment.open("a", encoding="utf-8") as fh:
                fh.write(
                    "\n\n> ⚠️ Partial behavior coverage: "
                    f"{count} behavior(s) had no matching baseline and were not evaluated"
                )
                if names:
                    fh.write(": `" + "`, `".join(names) + "`")
                fh.write(".\n")
        PY

    - name: Append gate report to job summary
      if: ${{ always() && hashFiles('pr_comment.md') != '' }}
      shell: bash
      run: cat pr_comment.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      id: post-comment
      if: ${{ inputs.post-pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      run: |
        python "${{ github.action_path }}/scripts/post_pr_comment.py" \
          --report gate_report.json \
          --body pr_comment.md

    - name: Upload assert-ai artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: assert-ai-artifacts
        path: assert-ai-artifacts/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload gate report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: assert-ai-gate-report
        path: |
          gate_report.json
          pr_comment.md
          assert-ai-behaviors.json
          assert-ai-resolved.json
        if-no-files-found: warn
        retention-days: 30

    - name: Decide exit code
      id: decide
      shell: bash
      env:
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        python <<'PY'
        import json
        import os
        import sys
        from pathlib import Path

        def as_bool(value: str | None, *, default: bool) -> bool:
            if value is None or value == "":
                return default
            return value.strip().lower() in {"1", "true", "yes", "y", "on"}

        report_path = Path("gate_report.json")
        if not report_path.is_file():
            print("::error::gate_report.json was not produced")
            sys.exit(1)

        report = json.loads(report_path.read_text(encoding="utf-8"))
        verdict = report.get("decision", "WARN")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            print(f"gate-verdict={verdict}", file=f)
            print(f"gate-report-path={Path.cwd() / report_path}", file=f)
            print(f"n-paired-cases={report.get('n_paired_cases', 0)}", file=f)
            print(f"behaviors-evaluated={report.get('behaviors_evaluated', 0)}", file=f)

        print(f"Gate verdict: {verdict} (mode: {report.get('gate_mode', 'regression')})")
        fail_on_regression = as_bool(os.environ.get("FAIL_ON_REGRESSION"), default=True)

        # FAIL is the only blocking verdict today. WARN (TooFewSamples, Uncertain,
        # no-overlap), Inconclusive, FirstRun, and TestSetChanged are intentional
        # fail-open states -- see docs/verdicts.md.
        if verdict == "FAIL" and fail_on_regression:
            print("::error::ASSERT gate failed -- see gate_report.json and the PR comment.")
            sys.exit(1)
        PY
