# Minimal ASSERT safety gate workflow.
# Pattern: refresh the baseline on push to main and on a nightly cron, then have
# pull requests compare against the latest trusted baseline resolved by the action.

name: Safety regression gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # nightly baseline refresh — catches model upgrades
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read          # required so the action can find the baseline run
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: responsibleai/assert-ai-action@v1
        with:
          # One behavior per YAML: every match becomes its own gated behavior.
          configs: eval/behaviors/*.yaml
          baseline: assert-ai-baseline
          min-pairs: '30'
          # Install the repository under test so target.callable imports work,
          # including src/ layouts. Change this for your package manager.
          target-install: python -m pip install -e .
          # Use regression,otel for traced callables; add langgraph for LangGraph.
          extras: regression,otel
          azure-api-key: ${{ secrets.AZURE_API_KEY }}
          azure-api-base: ${{ secrets.AZURE_API_BASE }}
          azure-api-version: ${{ secrets.AZURE_API_VERSION }}
          # Any other LiteLLM provider works via provider-env instead:
          # provider-env: |
          #   OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: assert-ai-baseline
          path: assert-ai-artifacts/
          retention-days: 90
